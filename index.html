<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neuqua Valley Astronomy Club</title>
  
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b0d17;
      color: #e0e6ed;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    /* TOP NAVIGATION & DROPDOWN MENU */
    nav {
      position: sticky;
      top: 0;
      background-color: #161b33;
      border-bottom: 1px solid #232d48;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      z-index: 1000;
    }

    .menu-btn {
      background: none;
      border: none;
      color: #38bdf8;
      font-size: 1.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px;
    }

    .menu-btn span {
      font-size: 1rem;
      font-weight: 600;
      color: #e0e6ed;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 10px;
      background-color: #161b33;
      border: 1px solid #232d48;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      flex-direction: column;
      width: 220px;
      padding: 8px 0;
      z-index: 1001;
    }

    .dropdown-menu.show {
      display: flex;
    }

    .dropdown-menu button {
      background: none;
      border: none;
      color: #93c5fd;
      text-align: left;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 20px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .dropdown-menu button:hover {
      background-color: #232d48;
      color: #ffffff;
    }

    .dropdown-menu button.active {
      background-color: #38bdf8;
      color: #0b0d17;
    }

    /* ROCKET EXPLORATION PROGRESS BAR */
    .progress-container {
      background-color: #0b0d17;
      padding: 12px 20px;
      border-bottom: 1px solid #1f293d;
    }

    .progress-label {
      font-size: 0.9rem;
      color: #38bdf8;
      text-align: center;
      margin-bottom: 8px;
      min-height: 2.7em;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
    }

    .planets-track {
      position: relative;
      height: 36px;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
    }

    .track-line {
      position: absolute;
      top: 50%;
      left: 20px;
      right: 20px;
      height: 3px;
      background-color: #232d48;
      transform: translateY(-50%);
      z-index: 1;
    }

    .planet-node {
      position: relative;
      z-index: 2;
      font-size: 1.4rem;
      background: #0b0d17;
      padding: 2px;
      border-radius: 50%;
      transition: transform 0.3s;
    }

    .rocket-icon {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      font-size: 1.6rem;
      z-index: 3;
      transition: left 0.5s ease-in-out;
    }

    header {
      background: linear-gradient(180deg, #161b33 0%, #0b0d17 100%);
      text-align: center;
      padding: 30px 20px 20px;
      border-bottom: 1px solid #1f293d;
    }

    .logo-container img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(77, 166, 255, 0.4);
      object-fit: cover;
    }

    h1 {
      color: #4da6ff;
      font-size: 2.2rem;
      margin: 10px 0 5px;
    }

    .tagline {
      font-size: 1.1rem;
      color: #a0aec0;
      margin-top: 0;
    }

    main {
      max-width: 850px;
      margin: 0 auto;
      padding: 20px;
    }

    /* TAB CONTENT SECTIONS */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background: #161b33;
      border: 1px solid #232d48;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    h2 {
      color: #38bdf8;
      margin-top: 0;
      border-bottom: 1px solid #232d48;
      padding-bottom: 10px;
    }

    .status-badge {
      display: inline-block;
      background-color: #f59e0b;
      color: #000;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      margin-bottom: 10px;
    }

    /* COUNTDOWN TIMER STYLES */
    .countdown-box {
      background: #0f1426;
      border: 1px solid #38bdf8;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
      text-align: center;
    }

    .countdown-timer {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
    }

    .time-block {
      background: #161b33;
      border: 1px solid #232d48;
      padding: 10px 15px;
      border-radius: 8px;
      min-width: 60px;
    }

    .time-number {
      font-size: 1.8rem;
      font-weight: bold;
      color: #38bdf8;
      display: block;
    }

    .time-label {
      font-size: 0.75rem;
      color: #a0aec0;
      text-transform: uppercase;
    }

    .join-box {
      background: #0f1426;
      border: 1px solid #38bdf8;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
      text-align: center;
    }

    .join-btn {
      display: inline-block;
      background-color: #38bdf8;
      color: #0b0d17;
      font-weight: bold;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 6px;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .join-btn:hover {
      background-color: #7dd3fc;
    }

    .code-badge {
      background-color: #232d48;
      color: #38bdf8;
      padding: 4px 8px;
      font-family: monospace;
      font-size: 1.1rem;
      border-radius: 4px;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .feature-item {
      background: #0f1426;
      padding: 18px;
      border-radius: 8px;
      border-left: 4px solid #4da6ff;
    }

    .feature-item h3 {
      margin-top: 0;
      color: #ffffff;
      font-size: 1.1rem;
    }

      background: #0f1426;
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid #1f
